media:
  input: assets/img
  output: assets/img

content:
  - name: personal-profile
    label: 个人网站资料
    type: file
    path: data/profile.json
    format: json
    fields:
      - name: profile
        label: 首页个人资料
        type: object
        fields:
          - name: displayName
            label: 姓名 / 展示名称
            type: string
            required: true
          - name: tagline
            label: 职业标签
            type: string
            required: true
            description: 显示在姓名下方，建议用“ | ”分隔关键词。
          - name: avatar
            label: 头像
            type: image
            required: true
          - name: birth
            label: 出生年月
            type: string
            description: 例如 1995.04。
          - name: location
            label: 居住地址
            type: string
          - name: summary
            label: 职业定位介绍
            type: text
            list:
              min: 1
            required: true
            description: 每一项会显示为一个独立段落。
      - name: contact
        label: 联系方式
        type: object
        fields:
          - name: email
            label: 邮箱
            type: string
            required: true
          - name: phoneWechat
            label: 电话 / 微信（显示文字）
            type: string
            required: true
          - name: phoneDial
            label: 电话拨号值
            type: string
            required: true
            description: 仅使用数字和国家区号，例如 +8618710121420。
          - name: githubLabel
            label: GitHub 显示名称
            type: string
          - name: githubUrl
            label: GitHub 主页链接
            type: string
          - name: linkedinUrl
            label: LinkedIn 主页链接
            type: string
          - name: mapEmbedUrl
            label: 联系页地图嵌入链接
            type: text
            description: 高德地图或其他地图提供的 HTTPS 嵌入链接。
      - name: education
        label: 学历信息
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: 学校 · 专业（学历）
            type: string
            required: true
          - name: period
            label: 时间
            type: string
            required: true
          - name: description
            label: 学习内容 / 说明
            type: text
            required: true
      - name: experience
        label: 职业履历
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: 公司 · 职位
            type: string
            required: true
          - name: period
            label: 任职时间
            type: string
            required: true
          - name: description
            label: 工作内容
            type: text
            required: true
      - name: skills
        label: 专业技能
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: 技能名称
            type: string
            required: true
          - name: description
            label: 技能说明
            type: text
            required: true
      - name: skillFocus
        label: 持续提升方向
        type: text

  - name: blog-posts
    label: 技术博客 · 文章管理
    type: file
    path: data/posts.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: slug
        label: 唯一文章标识（英文小写和连字符，发布后不要修改）
        type: string
        required: true
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description: 例如 google-seo-index。决定文章链接 ?id=google-seo-index，不可与其他文章重复。
      - name: title
        label: 文章标题
        type: string
        required: true
      - name: published
        label: 公开发布（关闭则不在网站显示）
        type: boolean
        default: false
      - name: date
        label: 发布日期
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: category
        label: 文章分类
        type: select
        options:
          values: [Google SEO, AI与自动化, B2B数字营销, 网站运营, 设计与视频, 工作思考, 其他]
      - name: cover
        label: 封面静态图片（图片模式或视频预览图）
        type: image
      - name: coverType
        label: 封面展示方式
        type: select
        default: image
        options:
          values:
            - name: image
              label: 图片封面
            - name: video
              label: 短视频封面（建议5–10秒）
      - name: coverVideo
        label: 封面短视频（MP4/WebM，建议5–10秒、无声）
        type: file
        options:
          categories: [video]
          extensions: [mp4, webm]
          path: assets/video
          rename: safe
      - name: excerpt
        label: 摘要（列表展示）
        type: text
      - name: body
        label: 正文 · 富文本编辑器（可插入图片、标题、链接、列表、加粗等）
        type: rich-text
        required: true
        options:
          format: html
          switcher: true
          path: assets/img
          rename: safe
      - name: font
        label: 正文字体（整篇）
        type: select
        options:
          values:
            - name: system
              label: 网站默认字体
            - name: serif
              label: 宋体 / 衬线
            - name: sans
              label: 黑体 / 无衬线
      - name: fontSize
        label: 正文字号（整篇）
        type: select
        options:
          values:
            - name: "14"
              label: 14px
            - name: "16"
              label: 16px
            - name: "18"
              label: 18px
            - name: "20"
              label: 20px
      - name: align
        label: 正文对齐（整篇）
        type: select
        options:
          values:
            - name: left
              label: 左对齐
            - name: center
              label: 居中
            - name: right
              label: 右对齐
            - name: justify
              label: 两端对齐
      - name: seoTitle
        label: SEO标题（可选）
        type: string
      - name: seoDescription
        label: SEO描述（可选）
        type: text
  - name: project-portfolio
    label: 项目作品 · 作品管理
    type: file
    path: data/projects.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: slug
        label: 唯一作品标识
        type: string
        required: true
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      - name: title
        label: 作品标题
        type: string
        required: true
      - name: published
        label: 公开展示
        type: boolean
        default: false
      - name: category
        label: 作品分类
        type: select
        options:
          values: [SEO与网站运营, AI与自动化, 平面设计, 视频制作, 社媒运营, 跨境营销, 其他]
      - name: cover
        label: 作品封面静态图片（图片模式或视频预览图）
        type: image
      - name: coverType
        label: 封面展示方式
        type: select
        default: image
        options:
          values:
            - name: image
              label: 图片封面
            - name: video
              label: 短视频封面（建议5–10秒）
      - name: coverVideo
        label: 封面短视频（MP4/WebM，建议5–10秒、无声）
        type: file
        options:
          categories: [video]
          extensions: [mp4, webm]
          path: assets/video
          rename: safe
      - name: description
        label: 项目背景 / 负责内容
        type: text
      - name: body
        label: 详细介绍（富文本）
        type: rich-text
        options:
          format: html
          switcher: true
          path: assets/img
          rename: safe
      - name: link
        label: 项目相关链接（选填）
        type: string

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      update: "内容更新：{path}（Pages CMS）"
